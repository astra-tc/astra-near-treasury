name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: spend_guard unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/spend_guard
      - name: Test
        run: cargo test --manifest-path contracts/spend_guard/Cargo.toml -- --nocapture

  node:
    name: node workspace check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Trivial node check
        run: node -e "console.log('node workspace ok')"
      - name: Package stubs present
        run: |
          test -f x402/package.json
          test -f agents/package.json
          test -f intents/package.json
          test -f dashboard/package.json
