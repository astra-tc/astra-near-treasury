name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: spend_guard unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/spend_guard
      - name: Test
        run: cargo test --manifest-path contracts/spend_guard/Cargo.toml -- --nocapture

  node:
    name: x402 + agents unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install workspace
        run: pnpm install
      - name: x402 tests
        run: pnpm --filter @astra-near/x402 test
      - name: agents tests
        run: pnpm --filter @astra-near/agents test
